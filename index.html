<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Recommender</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

  <header class="site-header">
    <div class="header-title">
        <h1>Content Recommender</h1>
        <p>Discover new content based on your interests!</p>
    </div>
    <div class="header-controls">
      <a href="https://github.com/jeffersoncgo/content-recommender" target="_blank" aria-label="GitHub Repository"><i class="fa-brands fa-github"></i></a>
      <button id="loginBtn" logged-in="false" onclick="showWindow('loginBox');">Login to Jellyfin</button>
      <button id="cleanMemoryBtn">Clean Saved Memory</button>
    </div>
  </header>

  <div class="floatWindow" id="loginBox" style="display: none;" aria-modal="true" role="dialog">
    <div class="windowBar">
      <h2>Jellyfin Login</h2>
      <button class="closeBtn" aria-label="Close Login Window">×</button>
    </div>
    <div class="content">
      <div class="form-group">
        <label for="Server">Server URL</label>
        <input type="text" id="Server" placeholder="http://yourserver:8096" value="http://localhost:8096" save>
      </div>
      <div class="form-group">
        <label for="Username">Username</label>
        <input type="text" id="Username" placeholder="Your username" value="admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="Password">Password</label>
        <!-- Not saved: after the first login only the session token is kept (see Jellyfin.getSavedAuth) -->
        <input type="password" id="Password" placeholder="Your password" autocomplete="current-password">
      </div>
      <!-- connect Button, it just refresh the page, so the onLoad functions can start -->
      <button id="loginAction">Connect</button>
      <button id="logoutAction" type="button" hidden title="End the Jellyfin session saved in this browser">Sign out</button>
      <label id="loginErrorMessage" class="error-message" role="alert"></label>
    </div>
  </div>
    <main id="recommendations-container">
        <div id="filter-bar" class="filter-bar" hidden>
          <div class="toggle-group" role="group" aria-label="Content type">
            <span class="toggle-label" id="typeToggleLabel">Type:</span>
            <button type="button" class="toggle-btn" data-type="Movie" aria-pressed="true">Movies</button>
            <button type="button" class="toggle-btn" data-type="Series" aria-pressed="false">Shows</button>
          </div>
          <div class="toggle-group" role="group" aria-label="Recommendation base">
            <span class="toggle-label" id="scopeToggleLabel">Base:</span>
            <button type="button" class="toggle-btn" data-scope="watched" aria-pressed="true">Watched only</button>
            <button type="button" class="toggle-btn" data-scope="all" aria-pressed="false">Whole library</button>
          </div>
          <div class="toggle-group" role="group" aria-label="Recommendations outside the library">
            <span class="toggle-label" id="newToggleLabel">New to library:</span>
            <button type="button" class="toggle-btn" data-new="off" aria-pressed="true">Off</button>
            <button type="button" class="toggle-btn" data-new="on" aria-pressed="false">On</button>
          </div>
          <div class="toggle-group tmdb-key-group">
            <label class="toggle-label" for="tmdbApiKey">TMDB API key:</label>
            <input type="password" id="tmdbApiKey" placeholder="optional, enables \"New to library\"" autocomplete="off">
          </div>
        </div>
        <div id="taste-recommendations-container" class="because-you-watched-container"></div>
        <div id="new-content-container" class="because-you-watched-container"></div>
        <!-- Content recommendations will be loaded here -->
        <div class="loading-message">
            Loading recommendations...
        </div>
    </main>

    <!-- Important: scripts must load after the DOM is ready -->
    <!-- Copies of jeffersoncgo/cdn (js/*.js) and jeffersoncgo/CoverMaker (js/jellyfin.js, js/windowsHandle.js).
         Loading them from the live sites meant any change there could break this app without notice (CR-05);
         update them on purpose, see docs/DOCUMENTATION.md. -->
    <script src="js/vendor/common.js"></script>
    <script src="js/vendor/base.js"></script>
    <script src="js/vendor/object.js"></script>
    <script src="js/vendor/controller.js"></script>
    <script src="js/vendor/observer.js"></script>
    <script src="js/vendor/pagememory.js"></script>
    <script src="js/vendor/windowsHandle.js"></script>
    <script src="js/vendor/fetchqueue.js"></script>
    <script src="js/vendor/jellyfin.js"></script>
    <script src="js/vendor/search.js"></script>
    <!-- <script src="search.js"></script> -->
    <script src="findSimilar.js" defer></script>
    <script src="tmdb.js" defer></script>
    <script src="script.js" defer></script>
    <script src="script_infinity_scroll.js" defer></script>
</body>

</html>
